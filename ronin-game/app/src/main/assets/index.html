<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>RONIN: Night City</title><style>
:root{--bg:#070914;--panel:#0f1324;--text:#f7f8ff;--muted:#9aa2be;--pink:#ff5da2;--cyan:#58d8ff;--violet:#8a68ff;--gold:#ffcf66}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:#05070d;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}#app{height:100%;display:flex;flex-direction:column;background:linear-gradient(#080b16,#05070d)}.top{height:64px;display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid #20253b;background:#090c17}.brand{font-weight:950}.brand b{color:var(--pink)}.brand small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.hud{display:flex;gap:6px}.pill{padding:6px 8px;border-radius:12px;background:#121729;border:1px solid #252b43;text-align:center;min-width:54px}.pill .k{font-size:8px;color:var(--muted)}.pill .v{font-size:14px;font-weight:900}.stage{position:relative;flex:1;min-height:0}canvas{width:100%;height:100%;display:block;touch-action:none}.bottom{height:82px;padding:8px 10px 11px;display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:8px;background:#090c16;border-top:1px solid #20253b}.btn{border:1px solid #293049;border-radius:15px;background:#13182a;color:white;font-weight:900;font-size:14px}.skill{background:linear-gradient(135deg,#221c40,#32182e)}.overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(5,7,15,.84);backdrop-filter:blur(8px)}.card{width:min(360px,100%);border-radius:22px;padding:19px;background:#111625;border:1px solid #293049;box-shadow:0 30px 70px #0008}.logo{text-align:center;font-size:52px}.title{text-align:center;font-size:26px;font-weight:950;margin-top:5px}.title span{color:var(--pink)}.desc{font-size:13px;color:var(--muted);line-height:1.48;text-align:center;margin:9px 0 16px}.start{width:100%;min-height:52px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--gold),#ff985f);color:#16120c;font-weight:950;font-size:15px}.hidden{display:none!important}.upgrade-title{text-align:center;font-size:20px;font-weight:950;margin-bottom:12px}.choices{display:grid;gap:8px}.choice{text-align:left;border:1px solid #2a3049;background:#171c30;color:#fff;border-radius:16px;padding:12px}.choice b{display:block;font-size:14px;margin-bottom:3px}.choice span{font-size:12px;color:var(--muted)}.bigscore{text-align:center;font-size:40px;font-weight:950;color:var(--gold);margin:5px 0}@media(min-width:700px){#app{max-width:480px;margin:auto;border-left:1px solid #161a2a;border-right:1px solid #161a2a}}
</style></head><body><div id="app"><div class="top"><div class="brand">RONIN <b>NIGHT CITY</b><small>NEON ACTION • ONE HAND</small></div><div class="hud"><div class="pill"><div class="k">HP</div><div id="hp" class="v">100</div></div><div class="pill"><div class="k">COMBO</div><div id="combo" class="v">x1</div></div><div class="pill"><div class="k">KILLS</div><div id="kills" class="v">0</div></div></div></div><div class="stage" id="stage"><canvas id="game"></canvas><div id="startOverlay" class="overlay"><div class="card"><div class="logo">⚔️</div><div class="title">RONIN: <span>Night City</span></div><div class="desc">Герой атакует сам. Ты двигаешься между тремя линиями, уклоняешься от врагов, держишь комбо и выбираешь усиления. На 20-м убийстве приходит босс.</div><button class="start" id="startBtn">НАЧАТЬ ЗАБЕГ</button></div></div><div id="upgradeOverlay" class="overlay hidden"><div class="card"><div class="upgrade-title">Выбери усиление</div><div class="choices" id="upgradeChoices"></div></div></div><div id="endOverlay" class="overlay hidden"><div class="card"><div class="logo">🌃</div><div class="title">Забег окончен</div><div id="finalScore" class="bigscore">0</div><div id="finalText" class="desc"></div><button class="start" id="againBtn">ЕЩЁ РАЗ</button></div></div></div><div class="bottom"><button class="btn" id="leftBtn">← ВЛЕВО</button><button class="btn" id="rightBtn">ВПРАВО →</button><button class="btn skill" id="skillBtn">⚡ ТЕНЬ 0%</button></div></div><script>
(()=>{const cv=document.getElementById('game'),ctx=cv.getContext('2d'),stage=document.getElementById('stage');const hpEl=document.getElementById('hp'),comboEl=document.getElementById('combo'),killsEl=document.getElementById('kills'),skillBtn=document.getElementById('skillBtn'),startOverlay=document.getElementById('startOverlay'),up=document.getElementById('upgradeOverlay'),end=document.getElementById('endOverlay'),choices=document.getElementById('upgradeChoices');let W,H,dpr,raf,last,running=false,paused=false,player,enemies=[],parts=[],slashes=[],rain=[],build=[],spawn=0,kills=0,combo=1,comboT=0,score=0,boss=false,slow=0,swipe=null;
function resize(){dpr=Math.min(2,devicePixelRatio||1);W=stage.clientWidth;H=stage.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);build=[];let x=0;while(x<W+80){let w=40+Math.random()*55,h=90+Math.random()*220;build.push({x,w,h});x+=w+6}rain=Array.from({length:40},()=>({x:Math.random()*W,y:Math.random()*H,s:280+Math.random()*300,l:8+Math.random()*15}))}addEventListener('resize',resize);const laneX=l=>W*(.24+.26*l);
function reset(){player={x:W/2,y:H-95,lane:1,target:1,hp:100,damage:24,rate:.5,t:0,crit:.12,skill:0,skillA:0,armor:0,range:150};enemies=[];parts=[];slashes=[];spawn=.7;kills=0;combo=1;comboT=0;score=0;boss=false;slow=0;hud()}
function move(d){if(!running||paused)return;player.target=Math.max(0,Math.min(2,player.target+d))}document.getElementById('leftBtn').onpointerdown=()=>move(-1);document.getElementById('rightBtn').onpointerdown=()=>move(1);stage.onpointerdown=e=>swipe=e.clientX;stage.onpointerup=e=>{if(swipe===null)return;let dx=e.clientX-swipe;swipe=null;if(Math.abs(dx)>30)move(dx>0?1:-1)};
function enemy(isBoss=false){let l=Math.floor(Math.random()*3);const elite=Math.random()<.16;const hp=isBoss?330:(elite?75:44);enemies.push({lane:l,x:laneX(l),y:-55,hp:hp,max:hp,speed:isBoss?70:100+Math.random()*35,dmg:isBoss?28:14,size:isBoss?40:23,boss:isBoss,atk:0,dead:false})}
function burst(x,y,c,n=7){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*160,life:.6,c,size:2+Math.random()*3})}
function attack(e){let crit=Math.random()<player.crit,dmg=player.damage*(crit?1.8:1)*(player.skillA>0?1.65:1);e.hp-=dmg;slashes.push({x1:player.x,y1:player.y-20,x2:e.x,y2:e.y,life:.14,crit});burst(e.x,e.y,crit?'#ffcf66':'#ff5da2',crit?10:6);if(e.hp<=0){e.dead=true;kills++;combo=Math.min(12,combo+1);comboT=2.2;score+=Math.round((e.boss?1000:100)*combo);player.skill=Math.min(100,player.skill+(e.boss?100:15));if(e.boss){setTimeout(()=>finish(true),400)}else if(kills===20&&!boss){boss=true;enemy(true)}else if(kills%6===0)setTimeout(showUpgrade,150)}}
function update(dt){if(!running||paused)return;dt*=slow>0?.35:1;slow=Math.max(0,slow-dt);player.skillA=Math.max(0,player.skillA-dt);player.x+=(laneX(player.target)-player.x)*Math.min(1,dt*12);spawn-=dt;if(spawn<=0&&!enemies.some(e=>e.boss&&!e.dead)&&!boss){enemy();spawn=.7+Math.random()*.45}if(spawn<=0&&boss){spawn=.9}player.t-=dt;for(const r of rain){r.y+=r.s*dt;if(r.y>H+20){r.y=-20;r.x=Math.random()*W}}let target=null,dist=1e9;for(const e of enemies){if(e.dead)continue;e.y+=e.speed*dt;let d=Math.hypot(e.x-player.x,e.y-player.y);if(d<dist&&d<player.range){target=e;dist=d}if(e.y>player.y-16&&Math.abs(e.x-player.x)<40){if(e.atk<=0){if(player.target!==e.lane){slow=.25;combo=Math.min(12,combo+1);comboT=2;score+=20;burst(player.x,player.y,'#58d8ff',10)}else{player.hp-=Math.max(1,e.dmg-player.armor);combo=1;burst(player.x,player.y,'#ff6f7d',12);if(player.hp<=0){player.hp=0;finish(false);return}}e.atk=.7}}e.atk=Math.max(0,e.atk-dt);if(e.y>H+70)e.dead=true}if(target&&player.t<=0){attack(target);player.t=player.rate}for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=100*dt}for(const s of slashes)s.life-=dt;parts=parts.filter(p=>p.life>0);slashes=slashes.filter(s=>s.life>0);enemies=enemies.filter(e=>!e.dead);comboT-=dt;if(comboT<=0)combo=1;hud()}
function skill(){if(player.skill<100||!running||paused)return;player.skill=0;player.skillA=3;for(const e of enemies){if(!e.dead){e.hp-=player.damage*1.7;burst(e.x,e.y,'#8a68ff',8)}}}skillBtn.onclick=skill;function hud(){hpEl.textContent=Math.round(player?.hp||100);comboEl.textContent='x'+combo;killsEl.textContent=kills;skillBtn.textContent='⚡ ТЕНЬ '+Math.round(player?.skill||0)+'%'}
const upgrades=[['Острый клинок','+20% урона',()=>player.damage*=1.2],['Быстрые руки','+18% скорость атаки',()=>player.rate=Math.max(.2,player.rate*.82)],['Критический удар','+10% шанс крита',()=>player.crit=Math.min(.6,player.crit+.1)],['Броня','-4 урона от удара',()=>player.armor+=4],['Аура клинка','+35 дальность атаки',()=>player.range+=35],['Восстановление','+30 HP',()=>player.hp=Math.min(100,player.hp+30)]];function showUpgrade(){if(!running)return;paused=true;up.classList.remove('hidden');choices.innerHTML='';[...upgrades].sort(()=>Math.random()-.5).slice(0,3).forEach(u=>{let b=document.createElement('button');b.className='choice';b.innerHTML='<b>'+u[0]+'</b><span>'+u[1]+'</span>';b.onclick=()=>{u[2]();paused=false;up.classList.add('hidden');hud()};choices.appendChild(b)})}
function draw(){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#10132b');g.addColorStop(.6,'#101423');g.addColorStop(1,'#060810');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#d9e1ff';ctx.globalAlpha=.7;ctx.beginPath();ctx.arc(W*.78,H*.13,24,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;for(const b of build){let y=H-b.h-35;ctx.fillStyle='#0d1222';ctx.fillRect(b.x,y,b.w,b.h)}ctx.fillStyle='#080b12';ctx.beginPath();ctx.moveTo(W*.36,H*.33);ctx.lineTo(W*.64,H*.33);ctx.lineTo(W*.98,H);ctx.lineTo(W*.02,H);ctx.closePath();ctx.fill();ctx.strokeStyle='#58d8ff22';for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(W*(.4+i*.07),H*.33);ctx.lineTo(W*(.05+i*.3),H);ctx.stroke()}neon(18,H*.3,'東京','#8a68ff');neon(W-92,H*.42,'夜','#58d8ff');neon(20,H*.52,'侍','#ff5da2');for(const e of enemies)drawEnemy(e);drawPlayer();for(const s of slashes){ctx.strokeStyle=s.crit?'#ffcf66':'#ff5da2';ctx.lineWidth=s.crit?7:4;ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke()}for(const p of parts){ctx.globalAlpha=Math.max(0,p.life/.6);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.size,p.size)}ctx.globalAlpha=1;ctx.strokeStyle='#d9e7ff25';for(const r of rain){ctx.beginPath();ctx.moveTo(r.x,r.y);ctx.lineTo(r.x-4,r.y+r.l);ctx.stroke()}let be=enemies.find(e=>e.boss&&!e.dead);if(be){ctx.fillStyle='#0008';ctx.fillRect(W*.14,18,W*.72,17);ctx.fillStyle='#ff5da2';ctx.fillRect(W*.14,18,W*.72*Math.max(0,be.hp/be.max),17);ctx.fillStyle='#fff';ctx.font='800 10px system-ui';ctx.textAlign='center';ctx.fillText('NEON ONI',W/2,30)}}
function neon(x,y,t,c){ctx.save();ctx.shadowBlur=12;ctx.shadowColor=c;ctx.fillStyle=c;ctx.font='800 18px system-ui';ctx.fillText(t,x,y);ctx.restore()}function drawPlayer(){let x=player.x,y=player.y;ctx.save();ctx.shadowBlur=20;ctx.shadowColor=player.skillA>0?'#8a68ff':'#58d8ff';ctx.fillStyle='#15192a';ctx.beginPath();ctx.arc(x,y-34,16,0,Math.PI*2);ctx.fill();ctx.fillStyle='#daddec';ctx.fillRect(x-10,y-41,20,12);ctx.fillStyle='#0d1019';ctx.fillRect(x-15,y-17,30,40);ctx.fillStyle='#ff5da2';ctx.fillRect(x-2,y-17,4,40);ctx.strokeStyle='#f1f3ff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x+12,y-10);ctx.lineTo(x+31,y-39);ctx.stroke();ctx.restore()}function drawEnemy(e){ctx.save();ctx.translate(e.x,e.y);ctx.shadowBlur=e.boss?24:13;ctx.shadowColor=e.boss?'#ff5da2':'#8a68ff';ctx.fillStyle=e.boss?'#3a1830':'#1a1830';ctx.beginPath();ctx.arc(0,0,e.size,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(-e.size*.45,-4,e.size*.9,5);ctx.fillStyle=e.boss?'#ff5da2':'#8a68ff';ctx.fillRect(-e.size*.33,-3,e.size*.66,3);ctx.restore()}
function finish(win){if(!running)return;running=false;cancelAnimationFrame(raf);document.getElementById('finalScore').textContent=score.toLocaleString('ru-RU');document.getElementById('finalText').innerHTML=win?'Ты победил первого босса. Это и есть основной ритм игры: короткий забег, уклонения, комбо и выбор усилений.':'Убийства: <b>'+kills+'</b><br>Комбо: <b>x'+combo+'</b>';end.classList.remove('hidden')}function loop(ts){if(!running)return;let dt=Math.min(.035,(ts-last)/1000||0);last=ts;update(dt);draw();raf=requestAnimationFrame(loop)}function start(){resize();reset();startOverlay.classList.add('hidden');end.classList.add('hidden');running=true;paused=false;last=performance.now();raf=requestAnimationFrame(loop)}document.getElementById('startBtn').onclick=start;document.getElementById('againBtn').onclick=start;resize();reset();draw()})();
</script></body></html>
