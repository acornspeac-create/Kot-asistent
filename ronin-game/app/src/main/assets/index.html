<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RONIN: Night City v2</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#05070d;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{height:100%;display:flex;flex-direction:column;background:linear-gradient(#090d19,#040507)}
.top{height:66px;display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:#090c15;border-bottom:1px solid #242b40}
.brand{font-weight:950;font-size:15px}.brand b{color:#ff4f93}.brand small{display:block;color:#8994ad;font-size:9px;margin-top:2px}
.hud{display:flex;gap:5px}.pill{min-width:50px;background:#121827;border:1px solid #283149;border-radius:11px;padding:5px;text-align:center}.pill span{display:block;color:#8e98b0;font-size:8px}.pill strong{font-size:13px}
#stage{position:relative;flex:1;min-height:0}canvas{width:100%;height:100%;display:block;touch-action:none}
.controls{height:90px;padding:8px 10px 11px;display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:8px;background:#080b11;border-top:1px solid #20263a}
button{color:#fff;font-weight:900}.ctrl{border:1px solid #2b3349;border-radius:15px;background:#121827;font-size:14px}.skill{background:linear-gradient(135deg,#1d193a,#33182a)}
.overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(4,6,12,.86);backdrop-filter:blur(8px)}
.card{width:min(370px,100%);border:1px solid #2a3249;border-radius:22px;background:#111625;padding:19px;box-shadow:0 30px 75px #0009}
.logo{text-align:center;font-size:52px}.title{text-align:center;font-size:26px;font-weight:950}.title b{color:#ff4f93}.desc{text-align:center;color:#9ba4bb;line-height:1.45;font-size:13px;margin:9px 0 16px}
.start{width:100%;min-height:52px;border:0;border-radius:16px;background:linear-gradient(135deg,#ffd36b,#ff965c);color:#15110c;font-size:15px}
.hidden{display:none!important}.choices{display:grid;gap:8px}.choice{border:1px solid #2a334a;border-radius:15px;background:#171d2e;padding:11px;text-align:left}.choice b{display:block;font-size:14px}.choice span{display:block;color:#98a1b7;font-size:12px;margin-top:3px}.big{font-size:38px;font-weight:950;color:#ffd36b;text-align:center}
@media(min-width:700px){#app{max-width:500px;margin:auto;border-left:1px solid #171c29;border-right:1px solid #171c29}}
</style>
</head>
<body>
<div id="app">
 <div class="top">
  <div class="brand">RONIN <b>NIGHT CITY v2</b><small>NEON TOKYO • STREET FIGHT</small></div>
  <div class="hud">
   <div class="pill"><span>HP</span><strong id="hp">100</strong></div>
   <div class="pill"><span>COMBO</span><strong id="combo">x1</strong></div>
   <div class="pill"><span>KILLS</span><strong id="kills">0</strong></div>
  </div>
 </div>
 <div id="stage">
  <canvas id="game"></canvas>
  <div id="startOv" class="overlay"><div class="card">
   <div class="logo">⚔️</div><div class="title">RONIN: <b>Night City</b></div>
   <div class="desc">Ронин идёт через ночной город. Машины едут по улицам, а на него нападают банды: ножи, биты, цепи, трубы, стрелки и тяжёлые бойцы. Двигайся влево и вправо — атака катаной автоматическая.</div>
   <button id="start" class="start">НАЧАТЬ БОЙ</button>
  </div></div>
  <div id="upOv" class="overlay hidden"><div class="card"><div class="title">Усиление</div><div id="choices" class="choices"></div></div></div>
  <div id="endOv" class="overlay hidden"><div class="card"><div class="logo">🌃</div><div class="title">Район зачищен</div><div id="score" class="big">0</div><div id="endText" class="desc"></div><button id="again" class="start">ЕЩЁ РАЗ</button></div></div>
 </div>
 <div class="controls">
  <button id="left" class="ctrl">← ВЛЕВО</button><button id="right" class="ctrl">ВПРАВО →</button><button id="skill" class="ctrl skill">⚡ ТЕНЬ 0%</button>
 </div>
</div>
<script>
(()=>{
const q=id=>document.getElementById(id),cv=q('game'),ctx=cv.getContext('2d'),stage=q('stage');
let W,H,D=1,run=false,pause=false,last=0,raf=0,spawn=0,carSpawn=0,kills=0,combo=1,comboT=0,score=0,maxCombo=1,bossMade=false,slow=0;
let p,E=[],C=[],P=[],S=[],rain=[],build=[],touchX=null;
const laneX=l=>W*(.22+.28*l);
function resize(){D=Math.min(2,devicePixelRatio||1);W=stage.clientWidth;H=stage.clientHeight;cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0);world()}
function world(){build=[];let x=-10;while(x<W+80){let w=45+Math.random()*65,h=100+Math.random()*230;build.push({x,w,h});x+=w+6}rain=Array.from({length:45},()=>({x:Math.random()*W,y:Math.random()*H,s:320+Math.random()*300,l:8+Math.random()*16}))}
function reset(){p={x:laneX(1),y:H-108,lane:1,target:1,hp:100,damage:27,rate:.46,t:0,crit:.15,armor:1,range:170,skill:0,skillTime:0,anim:0,slash:0,dodge:0};E=[];C=[];P=[];S=[];spawn=.4;carSpawn=.5;kills=0;combo=1;comboT=0;score=0;maxCombo=1;bossMade=false;slow=0;hud()}
const specs={
 knife:{hp:48,spd:128,dmg:13,c:'#a55cff',w:'knife',s:1},
 bat:{hp:76,spd:92,dmg:18,c:'#ffba5a',w:'bat',s:1.08},
 biker:{hp:88,spd:150,dmg:20,c:'#72e6a6',w:'chain',s:1.08},
 gun:{hp:62,spd:80,dmg:17,c:'#55d6ff',w:'gun',s:1,gun:1},
 heavy:{hp:138,spd:65,dmg:25,c:'#ff6873',w:'pipe',s:1.25},
 boss:{hp:560,spd:68,dmg:30,c:'#ff4f93',w:'katana',s:1.48,boss:1}
};
function type(){let r=Math.random();if(kills<4)return r<.65?'knife':'bat';if(kills<10)return r<.28?'knife':r<.55?'bat':r<.75?'biker':'gun';return r<.18?'knife':r<.36?'bat':r<.56?'biker':r<.78?'gun':'heavy'}
function addEnemy(t=type()){let a=specs[t],l=Math.floor(Math.random()*3);E.push({type:t,lane:l,x:laneX(l),y:-75,hp:a.hp,max:a.hp,spd:a.spd,dmg:a.dmg,c:a.c,w:a.w,s:a.s,gun:!!a.gun,boss:!!a.boss,atk:0,shot:1+Math.random(),dead:false,anim:Math.random()*9})}
function addCar(){const cols=['#25304b','#57213b','#284031','#4b3b25','#222b40'];C.push({x:Math.random()<.5?-115:W+115,dir:Math.random()<.5?1:-1,y:H*(.56+Math.random()*.15),spd:70+Math.random()*80,c:cols[Math.floor(Math.random()*cols.length)],s:.78+Math.random()*.18})}
function move(d){if(!run||pause)return;let old=p.target;p.target=Math.max(0,Math.min(2,p.target+d));if(old!==p.target)p.dodge=.28}
q('left').onpointerdown=()=>move(-1);q('right').onpointerdown=()=>move(1);stage.onpointerdown=e=>touchX=e.clientX;stage.onpointerup=e=>{if(touchX==null)return;let dx=e.clientX-touchX;touchX=null;if(Math.abs(dx)>28)move(dx>0?1:-1)};
function burst(x,y,c,n=8){for(let i=0;i<n;i++)P.push({x,y,vx:(Math.random()-.5)*210,vy:(Math.random()-.5)*180,life:.6,max:.6,c,size:2+Math.random()*4})}
function slash(x1,y1,x2,y2,c,w=4){S.push({x1,y1,x2,y2,c,w,life:.13,max:.13})}
function hit(e){let cr=Math.random()<p.crit,d=p.damage*(cr?1.9:1)*(p.skillTime>0?1.8:1);e.hp-=d;p.slash=.15;slash(p.x+12,p.y-40,e.x,e.y,cr?'#ffd36b':'#f4f6ff',cr?7:4);burst(e.x,e.y,cr?'#ffd36b':'#ff4f93',cr?12:7);if(e.hp<=0){e.dead=1;kills++;combo=Math.min(15,combo+1);maxCombo=Math.max(maxCombo,combo);comboT=2.4;score+=Math.round((e.boss?1700:e.type==='heavy'?220:e.type==='gun'?170:120)*combo);p.skill=Math.min(100,p.skill+(e.boss?100:e.type==='heavy'?22:15));if(e.boss)setTimeout(()=>finish(1),450);else if(kills%6===0)setTimeout(upgrade,180)}}
function damage(e){if(p.dodge>.08&&p.target!==e.lane){slow=.3;combo=Math.min(15,combo+1);comboT=2.2;score+=25;burst(p.x,p.y-20,'#55d6ff',12);return}p.hp-=Math.max(1,e.dmg-p.armor);combo=1;burst(p.x,p.y-20,'#ff6873',13);if(p.hp<=0){p.hp=0;finish(0)}}
function update(dt){if(!run||pause)return;dt*=slow>0?.38:1;slow=Math.max(0,slow-dt);p.anim+=dt*7;p.slash=Math.max(0,p.slash-dt);p.dodge=Math.max(0,p.dodge-dt);p.skillTime=Math.max(0,p.skillTime-dt);p.x+=(laneX(p.target)-p.x)*Math.min(1,dt*14);p.lane=p.target;
 for(let r of rain){r.y+=r.s*dt;if(r.y>H+20){r.y=-25;r.x=Math.random()*W}}
 carSpawn-=dt;if(carSpawn<=0){addCar();carSpawn=1.5+Math.random()*2.5}for(let c of C)c.x+=c.dir*c.spd*dt;C=C.filter(c=>c.x>-170&&c.x<W+170);
 spawn-=dt;if(spawn<=0){if(kills>=24&&!bossMade){bossMade=1;addEnemy('boss')}else if(!E.some(e=>e.boss&&!e.dead))addEnemy();spawn=Math.max(.38,1.06-kills*.012)*(.82+Math.random()*.45)}
 p.t-=dt;let target=null,dist=1e9;
 for(let e of E){if(e.dead)continue;e.anim+=dt*6;e.y+=e.spd*dt;e.x+=(laneX(e.lane)-e.x)*Math.min(1,dt*9);let d=Math.hypot(e.x-p.x,e.y-p.y);if(d<dist&&d<p.range){target=e;dist=d}
  if(e.gun&&e.y>H*.25&&e.y<H*.65){e.shot-=dt;if(e.shot<=0){e.shot=1.4+Math.random()*.7;slash(e.x,e.y,p.x,p.y-15,'#55d6ff',3);if(p.target===e.lane)damage(e)}}
  if(!e.gun&&e.y>p.y-22&&Math.abs(e.x-p.x)<44&&e.atk<=0){damage(e);e.atk=.72}e.atk=Math.max(0,e.atk-dt);if(e.y>H+90)e.dead=1}
 if(target&&p.t<=0){hit(target);p.t=p.rate}comboT-=dt;if(comboT<=0)combo=1;for(let s of S)s.life-=dt;for(let a of P){a.life-=dt;a.x+=a.vx*dt;a.y+=a.vy*dt;a.vy+=120*dt}S=S.filter(s=>s.life>0);P=P.filter(a=>a.life>0);E=E.filter(e=>!e.dead);hud()}
function special(){if(!run||pause||p.skill<100)return;p.skill=0;p.skillTime=3;slow=.25;burst(p.x,p.y,'#8f6bff',24);for(let e of E){slash(p.x,p.y-35,e.x,e.y,'#8f6bff',7);e.hp-=p.damage*2;if(e.hp<=0){e.dead=1;kills++;score+=210;combo=Math.min(15,combo+1)}}maxCombo=Math.max(maxCombo,combo);comboT=2.5;hud()}
q('skill').onclick=special;
const ups=[['Острый клинок','+20% урона',()=>p.damage*=1.2],['Быстрые руки','+18% скорость атаки',()=>p.rate=Math.max(.2,p.rate*.82)],['Критическая техника','+10% шанс крита',()=>p.crit=Math.min(.65,p.crit+.1)],['Броня ронина','-4 урона от попадания',()=>p.armor+=4],['Длинный шаг','+38 дальность атаки',()=>p.range+=38],['Дыхание','восстановить 35 HP',()=>p.hp=Math.min(100,p.hp+35)]];
function upgrade(){if(!run)return;pause=1;q('upOv').classList.remove('hidden');let box=q('choices');box.innerHTML='';[...ups].sort(()=>Math.random()-.5).slice(0,3).forEach(u=>{let b=document.createElement('button');b.className='choice';b.innerHTML='<b>'+u[0]+'</b><span>'+u[1]+'</span>';b.onclick=()=>{u[2]();pause=0;q('upOv').classList.add('hidden');hud()};box.appendChild(b)})}
function hud(){q('hp').textContent=Math.max(0,Math.round(p?.hp||100));q('combo').textContent='x'+combo;q('kills').textContent=kills;q('skill').textContent='⚡ ТЕНЬ '+Math.round(p?.skill||0)+'%'}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function bg(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#11162e');g.addColorStop(.55,'#101624');g.addColorStop(1,'#060810');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#dce3ff';ctx.globalAlpha=.7;ctx.beginPath();ctx.arc(W*.8,H*.12,24,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;for(let b of build){let y=H-b.h-55;ctx.fillStyle='#0e1424';ctx.fillRect(b.x,y,b.w,b.h)}ctx.fillStyle='#090c13';ctx.beginPath();ctx.moveTo(W*.34,H*.34);ctx.lineTo(W*.66,H*.34);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();ctx.strokeStyle='#55d6ff22';for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(W*(.39+i*.075),H*.34);ctx.lineTo(W*(.05+i*.3),H);ctx.stroke()}neon(18,H*.29,'東京','#8f6bff');neon(W-80,H*.41,'夜','#55d6ff');neon(20,H*.51,'侍','#ff4f93')}
function neon(x,y,t,c){ctx.save();ctx.shadowBlur=14;ctx.shadowColor=c;ctx.fillStyle=c;ctx.font='800 17px system-ui';ctx.fillText(t,x,y);ctx.restore()}
function car(c){ctx.save();ctx.translate(c.x,c.y);ctx.scale(c.dir*c.s,c.s);ctx.fillStyle=c.c;rr(-45,-13,90,27,8);ctx.fill();ctx.fillStyle='#172233';rr(-22,-26,48,17,6);ctx.fill();ctx.fillStyle='#80d9ff';ctx.globalAlpha=.45;ctx.fillRect(-17,-22,16,9);ctx.fillRect(4,-22,16,9);ctx.globalAlpha=1;ctx.fillStyle='#07090d';ctx.beginPath();ctx.arc(-27,15,8,0,Math.PI*2);ctx.arc(27,15,8,0,Math.PI*2);ctx.fill();ctx.restore()}
function ronin(){let x=p.x,y=p.y,r=Math.sin(p.anim)*4,a=p.slash>0?1-p.slash/.15:0;ctx.save();ctx.translate(x,y);ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(0,25,29,8,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#1b2333';ctx.lineWidth=9;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-7,-1);ctx.lineTo(-10-r*.3,20);ctx.stroke();ctx.beginPath();ctx.moveTo(7,-1);ctx.lineTo(10+r*.3,20);ctx.stroke();ctx.fillStyle='#162033';rr(-18,-50,36,49,11);ctx.fill();ctx.fillStyle='#7c284e';ctx.fillRect(-19,-39,38,7);ctx.fillStyle='#e1c0b1';ctx.beginPath();ctx.ellipse(0,-69,13,16,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#171421';ctx.beginPath();ctx.moveTo(-13,-73);ctx.quadraticCurveTo(-5,-91,2,-84);ctx.quadraticCurveTo(10,-89,14,-71);ctx.lineTo(9,-58);ctx.lineTo(3,-66);ctx.lineTo(-2,-57);ctx.lineTo(-7,-66);ctx.lineTo(-13,-60);ctx.closePath();ctx.fill();ctx.fillStyle='#ff4f93';ctx.fillRect(-10,-71,20,2);ctx.strokeStyle='#1a2335';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(12,-40);ctx.lineTo(21+a*6,-22);ctx.stroke();ctx.save();ctx.translate(20+a*6,-24);ctx.rotate(-.7-a*1.35);ctx.strokeStyle='#edf2ff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(45,0);ctx.stroke();ctx.strokeStyle='#6b3b2a';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-12,0);ctx.lineTo(2,0);ctx.stroke();ctx.restore();ctx.restore()}
function bandit(e){let x=e.x,y=e.y,b=Math.sin(e.anim)*3,s=e.s;ctx.save();ctx.translate(x,y+b);ctx.scale(s,s);ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(0,27,24,7,0,0,Math.PI*2);ctx.fill();let body=e.type==='heavy'?'#382329':e.type==='gun'?'#1c303d':e.type==='biker'?'#20342a':e.type==='bat'?'#3a3020':e.boss?'#3a172f':'#252a37';ctx.strokeStyle='#161b25';ctx.lineWidth=e.boss?11:9;ctx.beginPath();ctx.moveTo(-7,0);ctx.lineTo(-10,23);ctx.stroke();ctx.beginPath();ctx.moveTo(7,0);ctx.lineTo(10,23);ctx.stroke();ctx.fillStyle=body;rr(-18,-44,36,48,9);ctx.fill();ctx.fillStyle='#d0ad9c';ctx.beginPath();ctx.ellipse(0,-61,12,14,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=e.c;ctx.fillRect(-12,-64,24,6);ctx.strokeStyle=body;ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(13,-35);ctx.lineTo(23,-18);ctx.stroke();ctx.strokeStyle='#d7dbe8';ctx.lineWidth=4;if(e.w==='knife'){ctx.beginPath();ctx.moveTo(23,-18);ctx.lineTo(35,-28);ctx.stroke()}if(e.w==='bat'){ctx.strokeStyle='#8b5b32';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(23,-18);ctx.lineTo(39,-38);ctx.stroke()}if(e.w==='pipe'){ctx.strokeStyle='#9ca4b2';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(23,-18);ctx.lineTo(41,-42);ctx.stroke()}if(e.w==='gun'){ctx.fillStyle='#697181';ctx.fillRect(20,-22,18,7)}if(e.w==='katana'){ctx.beginPath();ctx.moveTo(22,-18);ctx.lineTo(49,-50);ctx.stroke()}if(e.w==='chain'){ctx.strokeStyle='#c8cbd4';ctx.lineWidth=2;for(let i=0;i<5;i++){ctx.beginPath();ctx.arc(24+i*4,-18-i*4,2,0,Math.PI*2);ctx.stroke()}}ctx.restore();if(e.type==='heavy'||e.gun||e.boss){let w=e.boss?110:52;ctx.fillStyle='#0008';ctx.fillRect(x-w/2,y-95*s,w,5);ctx.fillStyle=e.c;ctx.fillRect(x-w/2,y-95*s,w*Math.max(0,e.hp/e.max),5)}}
function draw(){ctx.clearRect(0,0,W,H);bg();C.forEach(car);E.forEach(bandit);ronin();for(let s of S){ctx.globalAlpha=Math.max(0,s.life/s.max);ctx.strokeStyle=s.c;ctx.lineWidth=s.w;ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke()}ctx.globalAlpha=1;for(let a of P){ctx.globalAlpha=Math.max(0,a.life/a.max);ctx.fillStyle=a.c;ctx.fillRect(a.x,a.y,a.size,a.size)}ctx.globalAlpha=1;ctx.strokeStyle='#d8e5ff26';for(let r of rain){ctx.beginPath();ctx.moveTo(r.x,r.y);ctx.lineTo(r.x-5,r.y+r.l);ctx.stroke()}let b=E.find(e=>e.boss&&!e.dead);if(b){let w=W*.72,x=(W-w)/2;ctx.fillStyle='#0009';ctx.fillRect(x,18,w,17);ctx.fillStyle='#ff4f93';ctx.fillRect(x,18,w*Math.max(0,b.hp/b.max),17);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='800 10px system-ui';ctx.fillText('NEON SHOGUN',W/2,30);ctx.textAlign='left'}}
function finish(win){if(!run)return;run=0;cancelAnimationFrame(raf);q('score').textContent=score.toLocaleString('ru-RU');q('endText').innerHTML=win?'Ты победил <b>Neon Shogun</b>.<br>Убийства: <b>'+kills+'</b> • Лучшее комбо: <b>x'+maxCombo+'</b>':'Убийства: <b>'+kills+'</b><br>Лучшее комбо: <b>x'+maxCombo+'</b>';q('endOv').classList.remove('hidden')}
function loop(t){if(!run)return;let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();raf=requestAnimationFrame(loop)}
function start(){resize();reset();q('startOv').classList.add('hidden');q('endOv').classList.add('hidden');q('upOv').classList.add('hidden');run=1;pause=0;last=performance.now();raf=requestAnimationFrame(loop)}
q('start').onclick=start;q('again').onclick=start;addEventListener('resize',resize);resize();reset();draw();
})();
</script>
</body></html>
