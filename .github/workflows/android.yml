name: Android CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kot-assistant-android-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore stable development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kot-assistant-development-signing-v1

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Name APK
        id: apk
        shell: bash
        run: |
          NAME="KOT-Assistant-v0.1.${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kot-assistant-debug
          path: ${{ steps.apk.outputs.name }}

      - name: Publish automatic update release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: ${{ steps.apk.outputs.name }}
        shell: bash
        run: |
          TAG="v0.1.${GITHUB_RUN_NUMBER}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" --clobber
          else
            gh release create "$TAG" "$APK_NAME"               --target "$GITHUB_SHA"               --title "KOT Assistant $TAG"               --notes "Automatic KOT Assistant build. The app checks GitHub for newer releases in the background."
          fi
