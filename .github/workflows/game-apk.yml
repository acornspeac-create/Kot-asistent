name: Build Catch Game APK

on:
  push:
    branches: [ main ]
    paths:
      - 'simple-game/**'
      - '.github/workflows/game-apk.yml'
  workflow_dispatch:

concurrency:
  group: catch-game-apk-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Restore stable game signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: catch-game-development-signing-v1

      - name: Ensure stable game signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Catch Game Development,O=Catch Game,C=TJ" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Validate game JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("simple-game/app/src/main/assets/index.html").read_text(encoding="utf-8")
          start = html.rfind("<script>") + len("<script>")
          end = html.rfind("</script>")
          if start < len("<script>") or end <= start:
              raise SystemExit("Game script block not found")
          script = html[start:end]
          Path("/tmp/kot-game.js").write_text(script, encoding="utf-8")

          import re
          from collections import Counter
          ids = re.findall(r'\bid="([^"]+)"', html[:start])
          dupes = sorted(k for k,v in Counter(ids).items() if v > 1)
          if dupes:
              raise SystemExit("Duplicate HTML ids: " + ", ".join(dupes))

          html_ids = set(ids)
          refs = set(re.findall(r'\$\("#([A-Za-z0-9_-]+)"\)', script))
          missing = sorted(refs - html_ids)
          if missing:
              raise SystemExit("JavaScript references missing ids: " + ", ".join(missing))
          print(f"UI integrity OK: {len(html_ids)} ids, {len(refs)} direct JS refs")
          PY
          node --check /tmp/kot-game.js
          node simple-game/smoke-test.js

      - name: Build APK and AAB
        run: gradle -p simple-game :app:assembleDebug :app:bundleDebug --no-daemon

      - name: Prepare build files
        shell: bash
        run: |
          cp simple-game/app/build/outputs/apk/debug/app-debug.apk simple-game/KOT-Catch-v2.4.2.apk
          cp simple-game/app/build/outputs/bundle/debug/app-debug.aab simple-game/KOT-Catch-v2.4.2-test.aab

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: kot-catch-v2-4-2-build
          path: |
            simple-game/KOT-Catch-v2.4.2.apk
            simple-game/KOT-Catch-v2.4.2-test.aab
          retention-days: 7
