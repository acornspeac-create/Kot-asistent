name: Build Catch Game APK

on:
  push:
    branches: [ main ]
    paths:
      - 'simple-game/**'
      - '.github/workflows/game-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle -p simple-game :app:assembleDebug --no-daemon

      - name: Prepare APK
        run: cp simple-game/app/build/outputs/apk/debug/app-debug.apk simple-game/Catch-Game.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: catch-game-apk
          path: simple-game/Catch-Game.apk
          retention-days: 7
