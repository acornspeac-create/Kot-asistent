name: Build Catch Game APK

on:
  push:
    branches: [ main ]
    paths:
      - 'simple-game/**'
      - '.github/workflows/game-apk.yml'
  workflow_dispatch:

concurrency:
  group: catch-game-apk-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Restore stable game signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: catch-game-development-signing-v1

      - name: Ensure stable game signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -dname "CN=Catch Game Development,O=Catch Game,C=TJ"               -keyalg RSA               -keysize 2048               -validity 10000
          fi

      - name: Build APK
        run: gradle -p simple-game :app:assembleDebug :app:bundleDebug --no-daemon

      - name: Prepare APK
        run: cp simple-game/app/build/outputs/apk/debug/app-debug.apk simple-game/KOT-Catch-v2.2.apk\n          cp simple-game/app/build/outputs/bundle/debug/app-debug.aab simple-game/KOT-Catch-v2.2-test.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kot-catch-v2-2-build
          path: |\n            simple-game/KOT-Catch-v2.2.apk\n            simple-game/KOT-Catch-v2.2-test.aab
          retention-days: 7
