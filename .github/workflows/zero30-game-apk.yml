name: Build Zero30 APK

on:
  push:
    branches: [ main ]
    paths:
      - 'zero30-game/**'
      - '.github/workflows/zero30-game-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Validate JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path("zero30-game/app/src/main/assets/index.html").read_text(encoding="utf-8")
          start=html.rfind("<script>")+len("<script>")
          end=html.rfind("</script>")
          if start < len("<script>") or end <= start:
              raise SystemExit("Script not found")
          Path("/tmp/zero30.js").write_text(html[start:end], encoding="utf-8")
          PY
          node --check /tmp/zero30.js

      - name: Build APK
        run: gradle -p zero30-game :app:assembleDebug --no-daemon

      - name: Prepare APK
        run: cp zero30-game/app/build/outputs/apk/debug/app-debug.apk zero30-game/Zero30-v1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zero30-v1-0-apk
          path: zero30-game/Zero30-v1.0.apk
          retention-days: 7
