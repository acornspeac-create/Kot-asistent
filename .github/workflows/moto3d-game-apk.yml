name: Build MOTO Night Run 3D APK

on:
  push:
    branches: [ main ]
    paths:
      - 'moto3d-game/**'
      - '.github/workflows/moto3d-game-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Validate JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path("moto3d-game/app/src/main/assets/index.html").read_text(encoding="utf-8")
          s=h.rfind("<script>")+8
          e=h.rfind("</script>")
          if s < 8 or e <= s: raise SystemExit("script not found")
          Path("/tmp/moto3d.js").write_text(h[s:e],encoding="utf-8")
          PY
          node --check /tmp/moto3d.js
      - name: Build APK
        run: gradle -p moto3d-game :app:assembleDebug --no-daemon
      - name: Prepare APK
        run: cp moto3d-game/app/build/outputs/apk/debug/app-debug.apk moto3d-game/MOTO-Night-Run-3D-v2.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moto-night-run-3d-v2-apk
          path: moto3d-game/MOTO-Night-Run-3D-v2.apk
          retention-days: 7
