<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Лови цель</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#070b12;font-family:Arial,sans-serif;color:#fff}
#game{width:100vw;height:100vh;position:relative;overflow:hidden;background:radial-gradient(circle at top,#18233b,#070b12 70%)}
#top{position:absolute;top:18px;left:12px;right:12px;display:flex;gap:8px;justify-content:space-between;z-index:10;font-size:16px;font-weight:700}
.box{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.07);padding:10px 12px;border-radius:16px;backdrop-filter:blur(10px)}
#combo{position:absolute;top:82px;width:100%;text-align:center;font-size:26px;font-weight:900;color:#ffd43b;opacity:0;transform:scale(.5);transition:.13s;pointer-events:none}
#target{
  position:absolute;width:92px;height:92px;border-radius:50%;display:none;
  background:radial-gradient(circle at 35% 30%,#d7ffff 0 8%,#00e9ff 24%,#0868ff 63%,#0927a7 100%);
  box-shadow:0 0 18px #00c8ff,0 0 52px rgba(0,150,255,.62),inset 0 0 18px rgba(255,255,255,.45);
  cursor:pointer;transition:left .09s linear,top .09s linear,width .12s,height .12s,transform .08s;
}
#target:after{content:"";position:absolute;inset:26%;border-radius:50%;border:3px solid rgba(255,255,255,.85)}
#target.jump{transform:scale(.78) rotate(10deg)}
#target:active{transform:scale(.72)}
.screen{position:absolute;z-index:20;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(5,8,15,.89);text-align:center;padding:30px}
#gameOver{display:none}
h1{font-size:45px;line-height:1;margin:0 0 16px;letter-spacing:1px}
.logo{font-size:72px;margin-bottom:10px;filter:drop-shadow(0 0 16px rgba(0,200,255,.5))}
p{opacity:.84;font-size:17px;line-height:1.55;max-width:390px;margin:0}
button{margin-top:24px;border:0;padding:17px 42px;border-radius:30px;font-size:20px;font-weight:900;color:#fff;background:linear-gradient(135deg,#0066ff,#8a2be2);box-shadow:0 8px 30px rgba(60,80,255,.45)}
.floatScore{position:absolute;pointer-events:none;font-size:25px;font-weight:900;z-index:11;animation:fly .6s forwards}
@keyframes fly{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-70px) scale(1.5)}}
.flash{animation:flash .14s}
@keyframes flash{50%{filter:brightness(1.35)}}
#level{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:14px;opacity:.68;pointer-events:none}
</style>
</head>
<body>
<div id="game">
  <div id="top">
    <div class="box">Очки: <span id="score">0</span></div>
    <div class="box">❤️ <span id="lives">3</span></div>
    <div class="box">Рекорд: <span id="record">0</span></div>
  </div>

  <div id="combo"></div>
  <div id="target"></div>
  <div id="level">Уровень 1 · прыжок 0.55 сек</div>

  <div id="startScreen" class="screen">
    <div class="logo">🎯</div>
    <h1>ЛОВИ ЦЕЛЬ</h1>
    <p>Теперь цель сама убегает по экрану. Лови её до того, как закончится время. Чем выше уровень — тем быстрее она прыгает и тем меньше становится.</p>
    <button onclick="startGame()">ИГРАТЬ</button>
  </div>

  <div id="gameOver" class="screen">
    <div class="logo">💥</div>
    <h1>КОНЕЦ</h1>
    <p>Результат: <b id="finalScore">0</b><br>Лучший рекорд: <b id="finalRecord">0</b></p>
    <button onclick="startGame()">ЕЩЁ РАЗ</button>
  </div>
</div>

<script>
const game=document.getElementById("game");
const target=document.getElementById("target");
const scoreText=document.getElementById("score");
const livesText=document.getElementById("lives");
const recordText=document.getElementById("record");
const comboText=document.getElementById("combo");
const levelText=document.getElementById("level");
const startScreen=document.getElementById("startScreen");
const gameOverScreen=document.getElementById("gameOver");

let score=0,lives=3,combo=0,running=false;
let targetSize=92;
let roundTime=2200;
let jumpInterval=550;
let missTimer=null;
let jumpTimer=null;

let record=Number(localStorage.getItem("catchRecord"))||0;
recordText.textContent=record;

function clearGameTimers(){
  clearTimeout(missTimer);
  clearTimeout(jumpTimer);
  missTimer=null;
  jumpTimer=null;
}

function startGame(){
  clearGameTimers();
  score=0;
  lives=3;
  combo=0;
  targetSize=92;
  roundTime=2200;
  jumpInterval=550;
  running=true;

  scoreText.textContent="0";
  livesText.textContent="3";
  updateDifficultyLabel(1);

  startScreen.style.display="none";
  gameOverScreen.style.display="none";
  target.style.display="block";

  startRound();
}

function startRound(){
  if(!running)return;
  clearGameTimers();
  moveTarget(true);

  missTimer=setTimeout(()=>{
    if(!running)return;
    loseLife();
  },roundTime);

  scheduleJump();
}

function scheduleJump(){
  clearTimeout(jumpTimer);
  if(!running)return;

  const variation=Math.floor(Math.random()*120)-60;
  const delay=Math.max(140,jumpInterval+variation);

  jumpTimer=setTimeout(()=>{
    if(!running)return;
    moveTarget(false);
    scheduleJump();
  },delay);
}

function moveTarget(firstMove){
  target.style.width=targetSize+"px";
  target.style.height=targetSize+"px";

  const pad=14;
  const top=105;
  const bottom=50;
  const maxX=Math.max(pad,innerWidth-targetSize-pad);
  const maxY=Math.max(top,innerHeight-targetSize-bottom);

  let x=pad+Math.random()*Math.max(1,maxX-pad);
  let y=top+Math.random()*Math.max(1,maxY-top);

  if(!firstMove){
    const oldX=parseFloat(target.style.left)||0;
    const oldY=parseFloat(target.style.top)||top;

    for(let tries=0;tries<5;tries++){
      const dx=Math.abs(x-oldX);
      const dy=Math.abs(y-oldY);
      if(dx>targetSize*1.6 || dy>targetSize*1.6)break;
      x=pad+Math.random()*Math.max(1,maxX-pad);
      y=top+Math.random()*Math.max(1,maxY-top);
    }

    target.classList.add("jump");
    setTimeout(()=>target.classList.remove("jump"),85);
  }

  target.style.left=x+"px";
  target.style.top=y+"px";
}

function loseLife(){
  if(!running)return;

  clearGameTimers();
  combo=0;
  lives--;
  livesText.textContent=lives;

  if(navigator.vibrate)navigator.vibrate(80);

  if(lives<=0){
    endGame();
  }else{
    startRound();
  }
}

function updateDifficulty(){
  const level=1+Math.floor(score/10);

  targetSize=Math.max(34,92-(level-1)*4);
  jumpInterval=Math.max(170,550-(level-1)*32);
  roundTime=Math.max(850,2200-(level-1)*90);

  updateDifficultyLabel(level);
}

function updateDifficultyLabel(level){
  levelText.textContent="Уровень "+level+" · прыжок "+(jumpInterval/1000).toFixed(2)+" сек";
}

target.addEventListener("pointerdown",e=>{
  if(!running)return;

  e.stopPropagation();
  clearGameTimers();
  combo++;

  const bonus=1+Math.floor(combo/5);
  score+=bonus;
  scoreText.textContent=score;

  showFloatingScore(e.clientX,e.clientY,"+"+bonus);

  if(navigator.vibrate)navigator.vibrate(18);

  if(combo>=3){
    comboText.textContent="🔥 КОМБО x"+combo;
    comboText.style.opacity=1;
    comboText.style.transform="scale(1)";
    setTimeout(()=>comboText.style.opacity=0,330);
  }

  game.classList.remove("flash");
  void game.offsetWidth;
  game.classList.add("flash");

  updateDifficulty();
  startRound();
});

game.addEventListener("pointerdown",e=>{
  if(!running || e.target===target || e.target.tagName==="BUTTON")return;
  loseLife();
});

function showFloatingScore(x,y,text){
  const el=document.createElement("div");
  el.className="floatScore";
  el.textContent=text;
  el.style.left=x+"px";
  el.style.top=y+"px";
  game.appendChild(el);
  setTimeout(()=>el.remove(),600);
}

function endGame(){
  running=false;
  clearGameTimers();
  target.style.display="none";

  if(score>record){
    record=score;
    localStorage.setItem("catchRecord",record);
  }

  recordText.textContent=record;
  document.getElementById("finalScore").textContent=score;
  document.getElementById("finalRecord").textContent=record;
  gameOverScreen.style.display="flex";
}
</script>
</body>
</html>
